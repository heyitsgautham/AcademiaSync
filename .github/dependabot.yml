version: 2
updates:
  # One npm workspaces lockfile at the root covers user-service, course-service and the frontend
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /backend/user-service
      - /backend/course-service
      - /frontend
    schedule:
      interval: monthly

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
