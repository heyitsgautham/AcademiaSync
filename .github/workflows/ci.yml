name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, course-service]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academiasync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend/${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # One npm workspaces lockfile at the repo root installs every package
      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: academiasync_test
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.service }}
          path: backend/${{ matrix.service }}/coverage/lcov.info
          if-no-files-found: ignore

      - name: Audit production dependencies
        working-directory: .
        run: npm audit --workspace backend/${{ matrix.service }} --omit=dev --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Audit production dependencies
        working-directory: .
        run: npm audit --workspace frontend --omit=dev --audit-level=high

  database:
    name: Database schema and seed
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academiasync
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academiasync

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Apply the schema twice to prove it is idempotent
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f backend/database/init.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f backend/database/init.sql

      - name: Load the demo seed
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f backend/database/seed-demo-data.sql

      - name: Check seeded data
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/database/check-seed.sql

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: user-service
            dockerfile: backend/user-service/Dockerfile
            port: 5000
            check: /health
          - image: course-service
            dockerfile: backend/course-service/Dockerfile
            port: 5001
            check: /health
          - image: frontend
            dockerfile: frontend/Dockerfile
            port: 3000
            check: /login

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academiasync
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Every image builds from the repo root so it installs from the workspaces lockfile
      - name: Build image
        run: docker build --file ${{ matrix.dockerfile }} --tag academiasync-${{ matrix.image }}:ci .

      - name: Start container
        run: |
          docker run --detach --name app --network host \
            -e PORT=${{ matrix.port }} \
            -e DB_HOST=localhost -e DB_PORT=5432 -e DB_NAME=academiasync -e DB_USER=postgres -e DB_PASSWORD=postgres \
            -e JWT_SECRET=ci-only-jwt-secret -e JWT_REFRESH_SECRET=ci-only-refresh-secret \
            -e NEXTAUTH_SECRET=ci-only-nextauth-secret -e NEXTAUTH_URL=http://localhost:3000 \
            academiasync-${{ matrix.image }}:ci

      - name: Smoke test
        run: |
          for attempt in $(seq 30); do
            if curl -fsS "http://localhost:${{ matrix.port }}${{ matrix.check }}" > /dev/null; then
              echo "ok ${{ matrix.image }} answered ${{ matrix.check }}"
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

  status-check:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend, frontend, database, docker, secret-scan]
    if: always()
    steps:
      - name: Check CI status
        run: |
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Database: ${{ needs.database.result }}"
          echo "Docker images: ${{ needs.docker.result }}"
          echo "Secret scan: ${{ needs.secret-scan.result }}"
          for result in "${{ needs.backend.result }}" "${{ needs.frontend.result }}" "${{ needs.database.result }}" "${{ needs.docker.result }}" "${{ needs.secret-scan.result }}"; do
            [ "$result" = "success" ] || exit 1
          done
