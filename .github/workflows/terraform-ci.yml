name: Terraform CI

# Checks the infrastructure code on every change. It never authenticates to AWS;
# plans and applies run only from terraform-deploy.yml by manual dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Format, validate and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init without a backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

      # Plans and applies every module against a mocked AWS provider and checks the assertions in tests/.
      - name: Test
        run: terraform test -no-color

  lint:
    name: TFLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Install TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint
        run: tflint --recursive --format compact

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Pinned to the v0.36.0 commit rather than a movable tag.
      - name: Scan modules with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: terraform/modules
          severity: HIGH,CRITICAL
          exit-code: '1'

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install checkov==3.3.30

      # Fails on any finding that is not skipped inline with a reason.
      - name: Scan with Checkov
        run: checkov --config-file .checkov.yaml --output cli --output sarif --output-file-path console,checkov.sarif

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-sarif
          path: terraform/checkov.sarif
          if-no-files-found: ignore
